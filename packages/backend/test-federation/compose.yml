include:
  - ./compose.a.yml
  - ./compose.b.yml
  - ./compose.c.yml

services:
  tester:
    image: cherrypick.local:${NODE_VERSION}
    build:
      context: ../../..
      dockerfile: ./packages/backend/test-federation/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
    depends_on:
      a.test:
        condition: service_healthy
      cherrypick.a.test:
        condition: service_healthy
      b.test:
        condition: service_healthy
      cherrypick.b.test:
        condition: service_healthy
      c.test:
        condition: service_healthy
      cherrypick.c.test:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/rootCA.crt
    volumes:
      # Mount the test sources so they can be edited and re-run without rebuilding the image.
      - type: bind
        source: ./test
        target: /cherrypick/packages/backend/test-federation/test
        read_only: true
      - type: bind
        source: ../test/resources
        target: /cherrypick/packages/backend/test/resources
        read_only: true
      - type: bind
        source: ./certificates/rootCA.crt
        target: /usr/local/share/ca-certificates/rootCA.crt
        read_only: true
    working_dir: /cherrypick
    command: pnpm -F backend test:fed

  daemon:
    image: cherrypick.local:${NODE_VERSION}
    build:
      context: ../../..
      dockerfile: ./packages/backend/test-federation/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
    depends_on:
      redis.test:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./daemon.ts
        target: /cherrypick/packages/backend/test-federation/daemon.ts
        read_only: true
      - type: bind
        source: ./tsconfig.json
        target: /cherrypick/packages/backend/test-federation/tsconfig.json
        read_only: true
    working_dir: /cherrypick
    command: >
      bash -c "
        pnpm exec tsc -p ./packages/backend/test-federation
        node ./packages/backend/test-federation/built/daemon.js
      "

  redis.test:
    image: redis:7-alpine
    volumes:
      - type: bind
        source: ./volumes/redis
        target: /data
        bind:
          create_host_path: true
    healthcheck:
      test: redis-cli ping
      interval: 5s
      retries: 20

  # Single postgres server shared by every site. Each site uses its own database
  # (cherrypick_a / cherrypick_b / cherrypick_c) created by init-db.sql on first init.
  db.test:
    image: postgres:15-alpine
    env_file:
      - ./.config/docker.env
    volumes:
      - type: bind
        source: ./init-db.sql
        target: /docker-entrypoint-initdb.d/init-db.sql
        read_only: true
      - type: bind
        source: ./volumes/db
        target: /var/lib/postgresql/data
        bind:
          create_host_path: true
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      retries: 20
