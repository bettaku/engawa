services:
  tester:
    networks:
      external_network:
      internal_network:
        ipv4_address: 172.20.1.1

  daemon:
    networks:
      - external_network
      - internal_network_a
      - internal_network_b
      - internal_network_c

  redis.test:
    networks:
      - internal_network_a
      - internal_network_b
      - internal_network_c

  db.test:
    networks:
      - internal_network_a
      - internal_network_b
      - internal_network_c

  a.test:
    networks:
      - internal_network

  cherrypick.a.test:
    networks:
      - external_network
      - internal_network

  b.test:
    networks:
      - internal_network

  cherrypick.b.test:
    networks:
      - external_network
      - internal_network

  c.test:
    networks:
      - internal_network

  cherrypick.c.test:
    networks:
      - external_network
      - internal_network

networks:
  external_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16
          ip_range: 172.23.0.0/24
  internal_network:
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          ip_range: 172.20.0.0/24
