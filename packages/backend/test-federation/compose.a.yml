services:
  a.test:
    extends:
      file: ./compose.tpl.yml
      service: nginx
    depends_on:
      cherrypick.a.test:
        condition: service_healthy
    networks:
      - internal_network_a
    volumes:
      - type: bind
        source: ./.config/a.test.conf
        target: /etc/nginx/conf.d/a.test.conf
        read_only: true
      - type: bind
        source: ./certificates/a.test.crt
        target: /etc/nginx/certificates/a.test.crt
        read_only: true
      - type: bind
        source: ./certificates/a.test.key
        target: /etc/nginx/certificates/a.test.key
        read_only: true

  cherrypick.a.test:
    extends:
      file: ./compose.tpl.yml
      service: cherrypick
    depends_on:
      db.test:
        condition: service_healthy
      redis.test:
        condition: service_healthy
    networks:
      - internal_network_a
    volumes:
      - type: bind
        source: ./.config/a.test.default.yml
        target: /cherrypick/.config/default.yml
        read_only: true

networks:
  internal_network_a:
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
          ip_range: 172.21.0.0/24
