services:
  nginx:
    image: nginx:1.27
    volumes:
      - type: bind
        source: ./certificates/rootCA.crt
        target: /etc/nginx/certificates/rootCA.crt
        read_only: true
    healthcheck:
      test: service nginx status
      interval: 5s
      retries: 20

  cherrypick:
    image: cherrypick.local:${NODE_VERSION}
    build:
      context: ../../..
      dockerfile: ./packages/backend/test-federation/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
    env_file:
      - ./.config/docker.env
    environment:
      - NODE_ENV=production
    volumes:
      # Runtime-generated config / certificate. Everything else is baked into the image.
      - type: bind
        source: ./certificates/rootCA.crt
        target: /usr/local/share/ca-certificates/rootCA.crt
        read_only: true
    working_dir: /cherrypick
    command: >
      bash -c "
        pnpm -F backend migrate
        pnpm -F backend start
      "
    healthcheck:
      test: bash /cherrypick/healthcheck.sh
      interval: 5s
      retries: 20
