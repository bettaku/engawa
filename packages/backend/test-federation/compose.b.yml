services:
  b.test:
    extends:
      file: ./compose.tpl.yml
      service: nginx
    depends_on:
      cherrypick.b.test:
        condition: service_healthy
    networks:
      - internal_network_b
    volumes:
      - type: bind
        source: ./.config/b.test.conf
        target: /etc/nginx/conf.d/b.test.conf
        read_only: true
      - type: bind
        source: ./certificates/b.test.crt
        target: /etc/nginx/certificates/b.test.crt
        read_only: true
      - type: bind
        source: ./certificates/b.test.key
        target: /etc/nginx/certificates/b.test.key
        read_only: true

  cherrypick.b.test:
    extends:
      file: ./compose.tpl.yml
      service: cherrypick
    depends_on:
      db.test:
        condition: service_healthy
      redis.test:
        condition: service_healthy
    networks:
      - internal_network_b
    volumes:
      - type: bind
        source: ./.config/b.test.default.yml
        target: /cherrypick/.config/default.yml
        read_only: true

networks:
  internal_network_b:
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
          ip_range: 172.22.0.0/24
