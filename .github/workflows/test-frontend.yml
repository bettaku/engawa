name: Test (frontend)

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages/frontend/**
      # for permissions
      - packages/cherrypick-js/**
      # for e2e
      - packages/backend/**
      - .github/workflows/test-frontend.yml
      - .github/cherrypick/test.yml
  pull_request:
    paths:
      - packages/frontend/**
      # for permissions
      - packages/cherrypick-js/**
      # for e2e
      - packages/backend/**
      - .github/workflows/test-frontend.yml
      - .github/cherrypick/test.yml
jobs:
  vitest:
    name: Unit tests (frontend)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4.3.0
      with:
        submodules: true
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.0.9
    - name: Use Node.js
      uses: actions/setup-node@v4.4.0
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - run: pnpm i --frozen-lockfile
    - name: Check pnpm-lock.yaml
      run: git diff --exit-code pnpm-lock.yaml
    - name: Copy Configure
      run: cp .github/cherrypick/test.yml .config
    - name: Build
      run: pnpm build
    - name: Test
      run: pnpm --filter frontend test-and-coverage
    - name: Upload Coverage
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./packages/frontend/coverage/coverage-final.json

  e2e:
    name: E2E tests (frontend)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]

    services:
      postgres:
        image: postgres:15
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-cherrypick
          POSTGRES_HOST_AUTH_METHOD: trust
      redis:
        image: redis:7
        ports:
          - 56312:6379

    steps:
    - uses: actions/checkout@v4.3.0
      with:
        submodules: true
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.0.9
    - name: Use Node.js
      uses: actions/setup-node@v4.4.0
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - run: pnpm i --frozen-lockfile
    - name: Copy Configure
      run: cp .github/cherrypick/test.yml .config
    - name: Build
      run: pnpm build
    - name: Install Playwright browsers
      run: pnpm --filter frontend exec playwright install --with-deps ${{ matrix.browser }}
    - name: E2E tests
      timeout-minutes: 30
      run: pnpm start-server-and-test start:test http://localhost:61812 "pnpm --filter frontend test:e2e --project=${{ matrix.browser }}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ matrix.browser }}-playwright-report
        path: packages/frontend/test/e2e/report
        retention-days: 7
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: ${{ matrix.browser }}-playwright-artifacts
        path: packages/frontend/test/e2e/artifacts
        retention-days: 7
