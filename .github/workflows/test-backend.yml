name: Test (backend)

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages/backend/**
      # for permissions
      - packages/cherrypick-js/**
      - .github/workflows/test-backend.yml
      - .github/cherrypick/test.yml
  pull_request:
    paths:
      - packages/backend/**
      # for permissions
      - packages/cherrypick-js/**
      - .github/workflows/test-backend.yml
      - .github/cherrypick/test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (backend)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version-file:
          - .node-version
          - .github/min.node-version
          - .github/max.node-version

    services:
      postgres:
        image: postgres:15
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-cherrypick
          POSTGRES_HOST_AUTH_METHOD: trust
      redis:
        image: redis:7
        ports:
          - 56312:6379

    steps:
    - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      with:
        persist-credentials: false
        submodules: true
    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
    - name: Install FFmpeg
      # ランナーイメージのパッケージ一覧が古いと、差し替えられた依存の .deb が 404 になる（2026-11-25 の pipewire）
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: ${{ matrix.node-version-file }}
        cache: 'pnpm'
    - run: pnpm i --frozen-lockfile
    - name: Check pnpm-lock.yaml
      run: git diff --exit-code pnpm-lock.yaml
    - name: Copy Configure
      run: cp .github/cherrypick/test.yml .config
    - name: Build
      run: pnpm build
    - name: Check generated config schema
      run: |
        pnpm --filter backend generate-config-schema
        git diff --exit-code -- packages/backend/config.schema.json
    - name: Test
      run: pnpm --filter backend test-and-coverage
    - name: Upload to Codecov
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./packages/backend/coverage/coverage-final.json

  e2e:
    name: E2E tests (backend)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version-file:
          - .node-version
          - .github/min.node-version
          - .github/max.node-version

    services:
      postgres:
        image: postgres:15
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-cherrypick
          POSTGRES_HOST_AUTH_METHOD: trust
      redis:
        image: redis:7
        ports:
          - 56312:6379

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          submodules: true
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ${{ matrix.node-version-file }}
          cache: 'pnpm'
      - run: pnpm i --frozen-lockfile
      - name: Check pnpm-lock.yaml
        run: git diff --exit-code pnpm-lock.yaml
      - name: Copy Configure
        run: cp .github/cherrypick/test.yml .config
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm --filter backend test-and-coverage:e2e
        env:
          # HTTP契約の試験（test/e2e/contract-*.ts）が、実際の応答をここに書く（RUST-03）
          # 成果物を上げる行（下）と同じ条件のときだけ書く
          CONTRACT_OUTPUT_DIR: ${{ matrix.node-version-file == '.node-version' && format('{0}/contract-actual', github.workspace) || '' }}
      - name: Upload actual contract responses
        # 保存した応答（test/fixtures/contract）との差分を、手元で再実行せずに確かめられるようにする
        if: ${{ !cancelled() && matrix.node-version-file == '.node-version' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-actual
          path: contract-actual
          if-no-files-found: ignore
      - name: Upload to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/backend/coverage/coverage-final.json

  migration:
    name: Migration tests (backend)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version-file:
          - .node-version
          #- .github/min.node-version
          #- .github/max.node-version

    services:
      postgres:
        image: postgres:15
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-cherrypick
          POSTGRES_HOST_AUTH_METHOD: trust

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          submodules: true
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Get current date
        id: current-date
        run: echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ${{ matrix.node-version-file }}
          cache: 'pnpm'
      - run: pnpm i --frozen-lockfile
      - name: Check pnpm-lock.yaml
        run: git diff --exit-code pnpm-lock.yaml
      - name: Copy Configure
        run: cp .github/cherrypick/test.yml .config
      - name: Build
        run: pnpm build
      - name: Run migrations
        run: CHERRYPICK_CONFIG_YML=test.yml pnpm --filter backend migrate
      - name: Check no migrations are remaining
        run: CHERRYPICK_CONFIG_YML=test.yml pnpm --filter backend check-migrations
      - name: Check the schema snapshot
        run: CHERRYPICK_CONFIG_YML=test.yml PG_DUMP_DOCKER_CONTAINER=${{ job.services.postgres.id }} pnpm --filter backend check:schema
