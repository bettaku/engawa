name: Test (federation)

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages/backend/**
      - packages/cherrypick-js/**
      - .github/workflows/test-federation.yml
  pull_request:
    paths:
      - packages/backend/**
      - packages/cherrypick-js/**
      - .github/workflows/test-federation.yml
  schedule:
    # Nightly full-matrix run (also covers the minimum supported Node version).
    - cron: '0 15 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests run only against the default Node version to keep them fast.
  # Pushes to master/develop, the nightly schedule and manual dispatches run the
  # full matrix including the minimum supported Node version.
  setup:
    name: Setup matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'matrix={"node-version-file":[".node-version"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"node-version-file":[".node-version",".github/min.node-version"]}' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Federation test
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4.3.0
        with:
          submodules: true
      - name: Set NODE_VERSION
        run: echo "NODE_VERSION=$(cat ${{ matrix.node-version-file }})" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Build the shared federation image once. Every container (app servers, tester, daemon)
      # reuses this image, so dependencies are installed and the project is built only once.
      - name: Build federation image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/backend/test-federation/Dockerfile
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
          tags: cherrypick.local:${{ env.NODE_VERSION }}
          load: true
          cache-from: type=gha,scope=fed-${{ env.NODE_VERSION }}
          cache-to: type=gha,mode=max,scope=fed-${{ env.NODE_VERSION }}
      - name: Setup
        run: |
          cd packages/backend/test-federation
          bash ./setup.sh
          sudo chmod 644 ./certificates/*.test.key
      - name: Start servers
        id: start_servers
        continue-on-error: true
        # https://github.com/docker/compose/issues/1294#issuecomment-374847206
        run: |
          cd packages/backend/test-federation
          docker compose up -d --scale tester=0
      - name: Print start_servers error
        if: ${{ steps.start_servers.outcome == 'failure' }}
        run: |
          cd packages/backend/test-federation
          docker compose logs | tail -n 300
          exit 1
      - name: Test
        run: |
          cd packages/backend/test-federation
          docker compose run --no-deps tester
      - name: Log
        if: always()
        run: |
          cd packages/backend/test-federation
          docker compose logs
      - name: Stop servers
        if: always()
        run: |
          cd packages/backend/test-federation
          docker compose down
