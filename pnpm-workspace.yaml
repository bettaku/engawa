packages:
  - packages/backend
  - packages/frontend-shared
  - packages/frontend
  - packages/frontend-builder
  - packages/frontend-embed
  - packages/icons-subsetter
  - packages/sw
  - packages/cherrypick-js
  - packages/cherrypick-js/generator
  - packages-internal/label-manager
onlyBuiltDependencies:
  - '@biomejs/biome'
  - '@nestjs/core'
  - '@parcel/watcher'
  - '@sentry/profiling-node'
  - '@swc/core'
  - '@tensorflow/tfjs-node'
  - argon2
  - bufferutil
  - canvas
  - core-js
  - cypress
  - esbuild
  - msgpackr-extract
  - msw
  - nice-napi
  - protobufjs
  - re2
  - sharp
  - utf-8-validate
  - v-code-diff
  - vue-demi
ignorePatchFailures: false
minimumReleaseAge: 10080 # delay 7days to mitigate supply-chain attack
minimumReleaseAgeExclude:
  - happy-dom # セキュリティ修正のため一時的に。そのうち消すこと
  - rolldown # 脆弱性対応。そのうち消す
  - '@rolldown/*' # 脆弱性対応。そのうち消す
  - vite # 脆弱性対応。そのうち消す
  - '@oxc-project/types'
