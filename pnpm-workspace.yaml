packages:
  - packages/backend
  - packages/frontend-shared
  - packages/frontend
  - packages/frontend-builder
  - packages/frontend-embed
  - packages/icons-subsetter
  - packages/sw
  - packages/cherrypick-js
  - packages/cherrypick-js/generator
  - packages-internal/label-manager
  - packages-internal/changelog-checker
allowBuilds:
  '@biomejs/biome': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@sentry/profiling-node': true
  '@sentry/node-cpu-profiler': true
  '@swc/core': true
  '@tensorflow/tfjs-node': true
  argon2: true
  bufferutil: true
  canvas: true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  nice-napi: true
  protobufjs: true
  re2: true
  sharp: true
  utf-8-validate: true
  v-code-diff: true
  vue-demi: true
overrides:
  chokidar: 4.0.3
  lodash: 4.18.1
  '@aiscript-dev/aiscript-languageserver': '-'
  # 脆弱性対応: 依存元が古いバージョンを固定しているため上書き
  '@misskey-dev/summaly>fastify': 5.12.1
  'undici@^7': 7.29.0
  'protobufjs@^7': 7.6.6
  # @tabler/icons-webfont の sharp はプレビュー生成用で未使用。脆弱な 0.33 系を排除
  '@tabler/icons-webfont>sharp': '-'
  'brace-expansion@^1': 1.1.18
  '@redocly/openapi-core>js-yaml': 4.3.2
minimumReleaseAge: 10080 # delay 7days to mitigate supply-chain attack
minimumReleaseAgeExclude:
  - happy-dom # セキュリティ修正のため一時的に。そのうち消すこと
  - rolldown # 脆弱性対応。そのうち消す
  - '@rolldown/*' # 脆弱性対応。そのうち消す
  - vite # 脆弱性対応。そのうち消す
  - '@oxc-project/types'
  - qs@6.16.0 # 脆弱性対応。そのうち消す
engineStrict: true
saveExact: true
shellEmulator: true
