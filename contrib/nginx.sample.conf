# engawa: internet -> nginx -> 127.0.0.1:3000 (see README.md).
# Include this file inside nginx.conf's http {}, e.g. conf.d/engawa.conf.
# Requires nginx >= 1.29.0 with ngx_http_ssl_module, ngx_http_v2_module,
# and the matching official nginx-module-acme package.
# Load the ACME module ONCE in nginx.conf's main context (outside http {}):
#   load_module modules/ngx_http_acme_module.so;
# The module path depends on the package; it may already be loaded.
# Replace engawa.example.com and admin@example.com before starting.

map $http_upgrade $engawa_connection_upgrade {
	default upgrade;
	'' close;
}

# Use DNS resolvers reachable from this server (required by the ACME client).
resolver 1.1.1.1 1.0.0.1 valid=300s;
resolver_timeout 5s;

acme_issuer engawa_letsencrypt {
	uri https://acme-v02.api.letsencrypt.org/directory;
	contact admin@example.com;
	# Persist this directory; only the nginx worker user should have access.
	state_path /var/lib/nginx/acme-engawa;
	# Debian/Ubuntu ca-certificates path; adjust for other distributions.
	ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
	accept_terms_of_service;
}

server {
	listen 80;
	listen [::]:80;
	server_name engawa.example.com;
	access_log off;

	# ACME intercepts HTTP-01 challenges before this location is processed.
	# Keep the redirect here, rather than at server scope.
	location / {
		return 308 https://engawa.example.com$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name engawa.example.com;
	server_tokens off;

	acme_certificate engawa_letsencrypt;
	ssl_certificate $acme_certificate;
	ssl_certificate_key $acme_certificate_key;
	ssl_certificate_cache max=2;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:engawa_tls:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	# Streaming URLs may contain tokens. Do not record query strings.
	access_log off;
	# 250 MiB default maxFileSize plus multipart overhead.
	client_max_body_size 256m;
	client_body_timeout 300s;

	location / {
		# Preserve paths, query strings and Host for ActivityPub signatures.
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		# This is the public edge: replace untrusted forwarding headers.
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $http_host;
		proxy_set_header Forwarded "";
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $engawa_connection_upgrade;

		proxy_connect_timeout 5s;
		proxy_read_timeout 3600s;
		proxy_send_timeout 300s;
		proxy_request_buffering off;
		proxy_buffering off;
		# API bodies can contain credentials; do not share-cache responses.
		proxy_cache off;
		proxy_next_upstream off;
	}
}
